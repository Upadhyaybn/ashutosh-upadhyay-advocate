spring:
  application:
    name: advocate-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ashutosh-upadhyay-advocate-api}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: INFO
    com.ashutoshupadhyay.advocate: INFO