spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ashutosh_advocate_db
    username: ashutosh_advocate_app
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true

security:
      jwt:
        secret: TestOnlyJwtSecretKeyForAdvocateApi2026Minimum32Chars
        expiration-minutes: 30
        issuer: ashutosh-upadhyay-advocate-api