services:

  postgres:
    image: postgres:18
    container_name: ashutosh-advocate-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - advocate-postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ashutosh_advocate_app -d ashutosh_advocate_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ashutosh-advocate-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Kolkata

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"


volumes:
  advocate-postgres-data: