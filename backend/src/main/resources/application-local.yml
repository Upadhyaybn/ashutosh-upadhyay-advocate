spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:LocalDevJwtSecretKeyForAdvocateApi2026Minimum32Chars}
    expiration-minutes: 30
    issuer: ashutosh-upadhyay-advocate-api